name: Client checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      CLIENT_WORKDIR: ${{ matrix.os == 'windows-latest' && 'Capsule ZIP 测试/capsule-client' || 'Capsule client 测试' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Capsule client 测试
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Capsule client 测试/package-lock.json
      - name: Extract the release ZIP on Windows
        if: runner.os == 'Windows'
        working-directory: Capsule client 测试
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'Capsule release 测试'
          node scripts/package-client.mjs $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem -LiteralPath $output -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected one Capsule release ZIP' }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'Capsule ZIP 测试')
      - run: npm ci
        working-directory: ${{ env.CLIENT_WORKDIR }}
      - name: Verify the native Windows CLI entrypoint
        if: runner.os == 'Windows'
        working-directory: ${{ env.CLIENT_WORKDIR }}
        shell: pwsh
        run: |
          $env:NPM_CONFIG_PREFIX = Join-Path $env:RUNNER_TEMP 'Capsule CLI 测试'
          npm.cmd link --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shim = Join-Path $env:NPM_CONFIG_PREFIX 'capsule.cmd'
          $helpJson = & $shim help organize --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $help = $helpJson | ConvertFrom-Json
          if ($help.name -ne 'organize' -or -not $help.options.prepare) { throw 'capsule.cmd did not return the current CLI help' }
      - run: npm run check
        working-directory: ${{ env.CLIENT_WORKDIR }}
      # Local UI and cache tests use fixtures. Integration with a separate server
      # and isolated Chromium remain available through the local test commands.
      - run: npm test
        working-directory: ${{ env.CLIENT_WORKDIR }}
