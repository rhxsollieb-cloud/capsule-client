<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>报价计算器</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main class="calculator">
    <header><h1>报价计算器</h1><span class="currency">CNY</span></header>
    <form id="quote-form">
      <div class="fields">
        <label>数量<input id="quantity" name="quantity" type="number" min="0" max="1000000" step="1" required disabled></label>
        <label>单价<span class="price-field"><span aria-hidden="true">¥</span><input id="unit-price" name="unitPrice" type="number" min="0" max="10000000" step="0.01" required disabled></span></label>
        <div class="amount-field"><span id="amount-label">金额</span><output id="amount" for="quantity unit-price" aria-labelledby="amount-label">—</output></div>
      </div>
      <div class="save-row"><span id="status" role="status" aria-live="polite">正在连接…</span><button id="save" type="submit" hidden>保存报价</button></div>
      <div id="notice" class="notice" hidden><p id="message" role="alert"></p><button id="reload" type="button" class="secondary" hidden>放弃输入并载入新版本</button></div>
    </form>
  </main>
</body>
</html>
