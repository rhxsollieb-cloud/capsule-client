<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Capsule · 知识工作台</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <div class="app">
      <div class="workspace">
        <aside id="knowledge-navigation" class="sidebar" aria-label="知识库">
          <div class="sidebar-header library-header">
            <button id="library-menu" class="library-mark library-menu-button" type="button" title="知识视图与工作台" aria-label="知识视图与工作台"><span data-icon="capsule"></span><span id="event-badge" class="attention-badge hidden"></span></button>
            <input id="library-filter" class="library-filter" type="search" placeholder="过滤知识库" autocomplete="off" title="过滤名称或简介 · ⌘K / Ctrl+K" aria-label="过滤知识库名称或简介" aria-controls="tree">
            <button id="new-cap" class="icon-button" type="button" title="新建 cap" aria-label="新建 cap" data-icon="plus"></button>
          </div>
          <button id="connection" class="connection-alert hidden" type="button" title="重试连接" aria-live="polite"></button>
          <div id="tree" class="tree-scroll" aria-label="知识节点"></div>
        </aside>
        <aside id="native-navigation" class="native-sidebar hidden" aria-label="所选 cap 的内容"></aside>
        <main class="main-pane">
          <div id="document-header" class="document-header"></div>
          <div id="content" class="content-view"></div>
          <section id="panel" class="panel hidden" aria-label="事件与运行结果"><div class="panel-header"><div class="panel-tabs"><button id="panel-events" class="tab-button active">事件</button><button id="panel-output" class="tab-button">运行结果</button></div><div class="button-group"><button id="panel-refresh" class="icon-button" title="刷新事件" aria-label="刷新事件" data-icon="refresh"></button><button id="panel-close" class="icon-button" title="收起面板" aria-label="收起面板" data-icon="close"></button></div></div><div id="panel-body" class="panel-body"></div></section>
        </main>
      </div>
    </div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <dialog id="dialog"></dialog>
  </body>
</html>
